name: Sync Outlook news

on:
  schedule:
    # GitHub cron runs in UTC. These two entries cover 09:30 Europe/Madrid
    # in summer time (07:30 UTC) and winter time (08:30 UTC); the job gate
    # below skips the non-matching one.
    - cron: '30 7 * * *'
    - cron: '30 8 * * *'
    # Second morning pass to catch the news email if it lands after 09:30.
    # These entries map to 11:30 Europe/Madrid in summer time (09:30 UTC)
    # and winter time (10:30 UTC).
    - cron: '30 9 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      mailbox_user_id:
        description: 'Mailbox UPN or Graph id, for example info@neovantas.com'
        required: false
        type: string
      mail_folder_name:
        description: 'Exact mail folder display name, for example Neovantas'
        required: false
        default: ''
        type: string
      sender:
        description: 'Optional exact sender email to import'
        required: false
        default: 'advanced.analytics@neovantas.com'
        type: string
      subject_contains:
        description: 'Optional text that the subject must contain'
        required: false
        default: 'Noticias relevantes de hoy'
        type: string
      lookback_days:
        description: 'How many days back to search'
        required: false
        default: '14'
        type: string
      max_items:
        description: 'Maximum Outlook news items to publish (use a high value to keep all)'
        required: false
        default: '1000'
        type: string

permissions:
  contents: write

concurrency:
  group: data-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync news JSON
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Madrid 09:30 schedule
        id: madrid-schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          madrid_offset="$(TZ=Europe/Madrid date +'%z')"
          if { [ "$madrid_offset" = "+0200" ] && { [ "$EVENT_SCHEDULE" = "30 7 * * *" ] || [ "$EVENT_SCHEDULE" = "30 9 * * *" ]; }; } || \
             { [ "$madrid_offset" = "+0100" ] && { [ "$EVENT_SCHEDULE" = "30 8 * * *" ] || [ "$EVENT_SCHEDULE" = "30 10 * * *" ]; }; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Outlook news sync for schedule $EVENT_SCHEDULE with Madrid offset $madrid_offset."
          fi

      - name: Setup Node
        if: steps.madrid-schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.madrid-schedule.outputs.should_run == 'true'
        run: npm ci

      - name: Normalize news folder
        if: steps.madrid-schedule.outputs.should_run == 'true'
        env:
          RAW_NEWS_MAIL_FOLDER: ${{ vars.NEWS_MAIL_FOLDER }}
          RAW_NEWS_MAIL_FOLDER_NAME: ${{ vars.NEWS_MAIL_FOLDER_NAME || inputs.mail_folder_name }}
        run: |
          raw="${RAW_NEWS_MAIL_FOLDER_NAME:-${RAW_NEWS_MAIL_FOLDER:-}}"
          normalized="$(printf '%s' "$raw" | tr -d '\r' | sed 's#\\#/#g' | xargs)"
          case "$(printf '%s' "$normalized" | tr '[:upper:]' '[:lower:]')" in
            ""|"/mailfolders/inbox/childfolders"|"mailfolders/inbox/childfolders"|"inbox")
              echo "NEWS_MAIL_FOLDER=inbox/Neovantas" >> "$GITHUB_ENV"
              echo "::notice::NEWS_MAIL_FOLDER invalid or empty; using inbox/Neovantas."
              ;;
            *)
              echo "NEWS_MAIL_FOLDER=$normalized" >> "$GITHUB_ENV"
              ;;
          esac
          echo "NEWS_MAIL_FOLDER_RAW=$raw" >> "$GITHUB_ENV"
          echo "NEWS_SUBJECT_PREFIX=${{ vars.NEWS_SUBJECT_PREFIX || vars.NEWS_SUBJECT_CONTAINS || inputs.subject_contains || 'Noticias relevantes de hoy' }}" >> "$GITHUB_ENV"

      - name: Check news configuration
        if: steps.madrid-schedule.outputs.should_run == 'true'
        id: news-config
        env:
          NEWS_MAILBOX_USER_ID: ${{ inputs.mailbox_user_id || secrets.NEWS_MAILBOX_USER_ID }}
        run: |
          if [ -z "$NEWS_MAILBOX_USER_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NEWS_MAILBOX_USER_ID is not configured. Set the secret or pass mailbox_user_id when running manually. Skipping Outlook news sync."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Outlook news
        if: steps.madrid-schedule.outputs.should_run == 'true' && steps.news-config.outputs.configured == 'true'
        run: npm run sync:news
        env:
          NEWS_TENANT_ID: ${{ secrets.NEWS_TENANT_ID || secrets.SHAREPOINT_TENANT_ID }}
          NEWS_CLIENT_ID: ${{ secrets.NEWS_CLIENT_ID || secrets.SHAREPOINT_CLIENT_ID }}
          NEWS_CLIENT_SECRET: ${{ secrets.NEWS_CLIENT_SECRET || secrets.SHAREPOINT_CLIENT_SECRET }}
          NEWS_MAILBOX_USER_ID: ${{ inputs.mailbox_user_id || secrets.NEWS_MAILBOX_USER_ID }}
          NEWS_MAIL_FOLDER: ${{ vars.NEWS_MAIL_FOLDER || vars.NEWS_MAIL_FOLDER_NAME || inputs.mail_folder_name || 'inbox/Neovantas' }}
          NEWS_SENDER: ${{ inputs.sender || vars.NEWS_SENDER || 'advanced.analytics@neovantas.com' }}
          NEWS_SUBJECT_PREFIX: ${{ inputs.subject_contains || vars.NEWS_SUBJECT_PREFIX || vars.NEWS_SUBJECT_CONTAINS || 'Noticias relevantes de hoy' }}
          NEWS_CATEGORY: ${{ vars.NEWS_CATEGORY || 'Comunicacion' }}
          NEWS_STATUS: ${{ vars.NEWS_STATUS || 'Nuevo' }}
          NEWS_SOURCE: ${{ vars.NEWS_SOURCE || 'Noticias relevantes de hoy' }}
          NEWS_ALLOW_UNFILTERED_INBOX: ${{ vars.NEWS_ALLOW_UNFILTERED_INBOX || 'false' }}
          NEWS_LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.NEWS_LOOKBACK_DAYS || '14' }}
          NEWS_MAX_ITEMS: ${{ inputs.max_items || vars.NEWS_MAX_ITEMS || '1000' }}

      - name: Upload news debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outlook-news-debug-${{ github.run_id }}
          path: |
            tmp/latest-news-email.txt
            tmp/latest-news-parsed-debug.json
          if-no-files-found: ignore

      - name: Validate build
        if: steps.madrid-schedule.outputs.should_run == 'true' && steps.news-config.outputs.configured == 'true'
        run: npm run build

      - name: Commit news changes
        if: steps.madrid-schedule.outputs.should_run == 'true' && steps.news-config.outputs.configured == 'true'
        run: |
          bash scripts/push-main-with-rebase.sh "chore: sync Outlook news" src/data/news.json
