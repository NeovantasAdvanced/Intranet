name: Sync SharePoint catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-sharepoint-catalog.yml
      - scripts/sync-sharepoint-catalog.mjs
      - src/data/sharepointCatalog.json
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync catalog JSON
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync SharePoint catalog
        run: npm run sync:sharepoint
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}

      - name: Validate build
        run: npm run build

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- src/data/sharepointCatalog.json; then
            echo "SharePoint catalog already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sharepointCatalog.json
          git commit -m "chore: sync SharePoint catalog"
          git push
