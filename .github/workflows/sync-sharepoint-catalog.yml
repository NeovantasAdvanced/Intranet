name: Sync SharePoint catalog

on:
  schedule:
    # GitHub cron runs in UTC. These two entries cover 09:30 Europe/Madrid
    # in summer time (07:30 UTC) and winter time (08:30 UTC); the job gate
    # below skips the non-matching one.
    - cron: '30 7 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync catalog JSON
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Madrid 09:30 schedule
        id: madrid-schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          madrid_offset="$(TZ=Europe/Madrid date +'%z')"
          if { [ "$madrid_offset" = "+0200" ] && [ "$EVENT_SCHEDULE" = "30 7 * * *" ]; } || \
             { [ "$madrid_offset" = "+0100" ] && [ "$EVENT_SCHEDULE" = "30 8 * * *" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping SharePoint catalog sync for schedule $EVENT_SCHEDULE with Madrid offset $madrid_offset."
          fi

      - name: Setup Node
        if: steps.madrid-schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.madrid-schedule.outputs.should_run == 'true'
        run: npm ci

      - name: Sync SharePoint catalog
        if: steps.madrid-schedule.outputs.should_run == 'true'
        run: npm run sync:sharepoint
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}

      - name: Validate build
        if: steps.madrid-schedule.outputs.should_run == 'true'
        run: npm run build

      - name: Commit catalog changes
        if: steps.madrid-schedule.outputs.should_run == 'true'
        run: |
          bash scripts/push-main-with-rebase.sh "chore: sync SharePoint catalog" src/data/sharepointCatalog.json
